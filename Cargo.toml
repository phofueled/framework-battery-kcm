[package]
name = "framework-battery-helper"
version = "0.3.1"
edition = "2021"
license = "BSD-3-Clause"
description = "Privileged EC backend for the Framework Battery KDE settings pane"

[dependencies]
anyhow = "1"
async-io = "2"
futures-lite = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
zbus_polkit = { version = "5.0", default-features = false }

[profile.release]
# The helper does little CPU work, so favor installed size over throughput.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
