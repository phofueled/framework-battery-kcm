[package]
name = "framework-battery-helper"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Privileged EC backend for the Framework Battery KDE settings pane"

[dependencies]
anyhow = "1"
async-io = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
framework_lib = { version = "=0.6.6", default-features = false }
futures-lite = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zbus = "5.19"
zbus_polkit = "5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
